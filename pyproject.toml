[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-ai-analyzer"
version = "1.0.0"
description = "AI-powered video understanding — extract frames with ffmpeg, analyze with vision LLMs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.0.0",
    "Pillow>=10.0.0",
    "google-generativeai>=0.5.0",
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.scripts]
video-ai = "video_analyzer.cli:main"

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
all = ["openai>=1.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["video_analyzer*"]
