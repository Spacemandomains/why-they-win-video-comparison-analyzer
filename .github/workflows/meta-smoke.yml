name: Meta Smoke Tests

# Manual-only smoke tests for Wilfred's 7 video-analyzer forks.
# Each job makes the SMALLEST REAL live call to the Meta Model API
# (Muse Spark 1.3) through that fork's OWN Meta code path, and uploads
# its log as an artifact. See smoke/README.md for details.
#
# Requires the MODEL_API_KEY repository secret:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: MODEL_API_KEY   Value: <Meta Model API key from dev.meta.ai>

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meta-smoke
  cancel-in-progress: false

jobs:
  video-ai-analyzer:
    name: video-ai-analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out harness (this repo)
        uses: actions/checkout@v4
        with:
          path: harness
      - name: Check out target fork
        uses: actions/checkout@v4
        with:
          repository: Spacemandomains/video-ai-analyzer
          path: target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run smoke test
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          set -o pipefail
          bash harness/smoke/run_smoke.sh video-ai-analyzer 2>&1 | tee smoke-video-ai-analyzer.log
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-video-ai-analyzer
          path: smoke-video-ai-analyzer.log
          if-no-files-found: ignore

  mcp-video:
